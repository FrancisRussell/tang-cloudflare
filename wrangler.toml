name = "tang"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-22"

[build]
# worker-build is a Rust tool (not an npm package), pinned to the version
# matching the `worker` crate in Cargo.toml so builds don't drift with
# releases.
command = "cargo install -q --locked worker-build@0.8.6 && worker-build --release"

# Created once with `wrangler kv namespace create tang-allowed-cidrs`; see
# README.md. The id below isn't sensitive (an opaque per-account
# identifier, not CIDR data), so it's fine to commit, unlike the CIDR list
# itself. Left unset, a plain `wrangler deploy` would provision a fresh,
# empty namespace on every deploy rather than reusing this one.
[[kv_namespaces]]
binding = "ALLOWED_CIDRS_KV"
id = "REPLACE_WITH_NAMESPACE_ID"

# The CIDR list itself is set with `npm run set-allowlist -- <cidr>[,<cidr>
# ...]`, independent of any deploy: a comma-separated list of CIDR ranges
# (v4 and/or v6) allowed to reach /adv and /rec, i.e. the VPS(es) this Tang
# instance actually serves, and the sole access control (Clevis, the
# client, sends no header beyond Content-Type and has no config option to
# add one, so there's no bearer credential to check alongside this). Keep
# it as tight as the real network topology allows (a bare /32 or /128)
# unless there's a concrete reason to widen it. `npm run get-allowlist`
# reads back the current value.
#
# TANG_KEYS is a secret, set with `npm run upload-key`:
#   {"sig": {...JWK...}, "exc": {...JWK...}}, the same JSON shape as the
#   password-manager backup, so this is a direct paste with nothing to
#   split by hand
