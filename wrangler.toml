name = "tang"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-22"
# Required: this is the *.workers.dev URL Clevis is pointed at (see
# README.md step 7).
workers_dev = true
# Each deployed version otherwise gets its own separate public hostname,
# for testing a version before promoting it (gradual deployments). Nothing
# here uses that, so there's no reason for the extra public endpoint.
preview_urls = false

[build]
# worker-build is a Rust tool (not an npm package), pinned to the version
# matching the `worker` crate in Cargo.toml so builds don't drift with
# releases. --no-default-features drops the "cli" feature, which pulls in
# clap/humantime for the keygen binary; that binary is never part of this
# build, so there's no reason to compile its dependencies here.
command = "cargo install -q --locked worker-build@0.8.6 && worker-build --release --no-default-features"

# A placeholder: `scripts/deploy.sh` substitutes the real namespace id
# into a generated copy (see wrangler.generated.toml, gitignored) rather
# than this file, since the real id is specific to one Cloudflare account
# and shouldn't be committed. See README.md for how the real namespace is
# found or created.
[[kv_namespaces]]
binding = "ALLOWED_CIDRS_KV"
id = "REPLACE_WITH_NAMESPACE_ID"

# The CIDR list itself is set with `npm run set-allowlist -- <cidr>[,<cidr>
# ...]`, independent of any deploy: a comma-separated list of CIDR ranges
# (v4 and/or v6) allowed to reach /adv and /rec, i.e. the VPS(es) this Tang
# instance actually serves, and the sole access control (Clevis, the
# client, sends no header beyond Content-Type and has no config option to
# add one, so there's no bearer credential to check alongside this). Keep
# it as tight as the real network topology allows (a bare /32 or /128)
# unless there's a concrete reason to widen it. `npm run get-allowlist`
# reads back the current value.
#
# TANG_KEYS is a secret, set with `npm run upload-key`, in the same JSON
# shape `keygen` prints and the password-manager backup holds, so this is
# a direct paste with nothing to assemble by hand

# Backstop against one source (an allowed IP with a retry-loop bug, or a
# disallowed one probing) repeatedly paying for a KV read and whatever
# follows it: a per-IP cap, checked in the Worker itself, needing no
# custom domain. 60/minute is far above any plausible legitimate burst
# (even several machines sharing a NAT gateway rebooting together, or a
# dev session hammering the endpoint), while still cutting off anything
# actually pathological. namespace_id is just a locally-chosen tag, not a
# provisioned resource.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
