[package]
name = "tang-cloudflare"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Tang (Network-Bound Disk Encryption) server, deployed as a Cloudflare Worker."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64ct = { version = "1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", default-features = false, features = ["derive", "help", "std", "usage", "wrap_help", "suggestions"], optional = true }
console_error_panic_hook = "0.1"
elliptic-curve = { version = "0.13", default-features = false, features = ["arithmetic", "sec1"] }
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.2", default-features = false, features = ["js"] }
http = { version = "1", default-features = false, features = ["std"] }
humantime = { version = "2", optional = true }
ipnetwork = { version = "0.20", default-features = false }
p521 = { version = "0.13", default-features = false, features = ["arithmetic", "getrandom"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tangy-lib = "0.1"
worker = { version = "0.8", default-features = false }

[dev-dependencies]
ctrlc = "3.5.2"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
ureq = { version = "2", default-features = false }

[features]
default = ["cli"]
# keygen's own dependencies. Not needed by the Worker itself (the wasm
# build passes --no-default-features; see wrangler.toml), only by that
# one native binary.
cli = ["dep:clap", "dep:humantime"]
# Gates tests/integration.rs; see that file's header comment.
integration-tests = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-tests"]

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
panic = "abort"
