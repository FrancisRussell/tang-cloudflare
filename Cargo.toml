[package]
name = "tang-cloudflare"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Tang (Network-Bound Disk Encryption) server, deployed as a Cloudflare Worker."
repository = "https://github.com/FrancisRussell/tang-cloudflare"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", default-features = false, features = ["derive", "help", "std", "usage", "wrap_help", "suggestions"], optional = true }
console_error_panic_hook = "0.1"
futures-util = { version = "0.3", default-features = false }
http = { version = "1", default-features = false, features = ["std"] }
humantime = { version = "2", optional = true }
ipnetwork = { version = "0.21", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tangy-lib = "1"
worker = { version = "0.8", default-features = false }

# tangy-lib's own getrandom dependency requests no wasm backend; this
# supplies one via feature unification, scoped away from WASI (which
# has its own, not a JS host).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
base64ct = { version = "1", default-features = false, features = ["alloc"] }
ctrlc = "3.5.2"
elliptic-curve = { version = "0.14", default-features = false, features = ["arithmetic"] }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
p521 = { version = "0.14", default-features = false, features = ["arithmetic", "getrandom"] }
sha2 = { version = "0.11", default-features = false }
ureq = { version = "3", default-features = false }

[features]
default = ["cli"]
# keygen's own dependencies. Not needed by the Worker itself (the wasm
# build passes --no-default-features; see wrangler.toml), only by that
# one native binary.
cli = ["dep:clap", "dep:humantime"]
# Gates tests/integration.rs; see that file's header comment.
integration-tests = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-tests"]

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
panic = "abort"
