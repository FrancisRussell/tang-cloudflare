[package]
name = "tang-cloudflare"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Tang (Network-Bound Disk Encryption) server, deployed as a Cloudflare Worker."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64ct = { version = "1", default-features = false, features = ["alloc"] }
console_error_panic_hook = "0.1"
# tangy-lib's own OsRng usage pulls in getrandom transitively; its "js"
# feature is required to even compile for wasm32-unknown-unknown, which
# otherwise hard-errors (see getrandom's own compile_error!).
getrandom = { version = "0.2", default-features = false, features = ["js"] }
http = { version = "1", default-features = false, features = ["std"] }
ipnetwork = { version = "0.20", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
tangy-lib = "0.1"
worker = { version = "0.8", default-features = false }

[dev-dependencies]
ctrlc = "3.5.2"
elliptic-curve = { version = "0.13", default-features = false, features = ["arithmetic", "sec1"] }
nix = { version = "0.31.3", features = ["signal"] }
p521 = { version = "0.13", default-features = false, features = ["arithmetic", "getrandom"] }
serde = { version = "1", default-features = false, features = ["derive"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
ureq = "2"

[features]
# Gates tests/integration.rs; see that file's header comment.
integration-tests = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-tests"]

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
panic = "abort"
